<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Свадебное Артёма & Ани</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #faf8f6;
      font-family: 'Montserrat', Arial, sans-serif;
      color: #222;
    }
    .form-container {
      max-width: 420px;
      margin: 40px auto;
      background: #262420;
      color: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 20px #bdbdbd24;
      padding: 32px 28px 20px 28px;
    }
    h2 {
      text-align: center;
      font-family: 'Playfair Display', serif;
      margin-bottom: 6px;
      letter-spacing: 1px;
      font-size: 1.5em;
    }
    label {
      display: block;
      margin: 18px 0 6px 0;
      font-weight: 500;
      letter-spacing: .02em;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 12px;
      background: #f5f5f2;
      color: #23201c;
      font-size: 1em;
    }
    textarea {
      min-height: 40px;
      max-height: 120px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 18px;
      margin-bottom: 7px;
    }
    .row label {
      margin: 0;
      font-weight: 400;
      font-size: 1em;
      color: #f5f5f2;
      cursor: pointer;
    }
    .btn {
      background: #B5A17A;
      color: #262420;
      border: none;
      padding: 13px 0;
      font-size: 1.13em;
      width: 100%;
      border-radius: 10px;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 18px;
    }
    .btn:active { background: #9b895f; }
    .success, .error {
      margin-top: 12px;
      text-align: center;
      font-size: 1.06em;
      font-weight: 500;
    }
    .success { color: #b4e7b4; }
    .error   { color: #ffc3c3; }
    .small { font-size: 0.91em; opacity: 0.8;}
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Свадебное Артёма & Ани</h2>
    <form id="weddingForm" autocomplete="off">
      <label>Ваше имя и фамилия *</label>
      <input type="text" name="name" required placeholder="Ваше имя">

      <label>Присутствие *</label>
      <div class="row">
        <label><input type="radio" name="attendance" value="Приду" required> Приду</label>
        <label><input type="radio" name="attendance" value="Не смогу"> Не смогу</label>
      </div>

      <label>Любимые напитки (можно несколько)</label>
      <div class="row">
        <label><input type="checkbox" name="drinks" value="Шампанское"> Шампанское</label>
        <label><input type="checkbox" name="drinks" value="Вино"> Вино</label>
        <label><input type="checkbox" name="drinks" value="Виски"> Виски</label>
        <label><input type="checkbox" name="drinks" value="Без алкоголя"> Без алкоголя</label>
      </div>

      <label>Предпочтения в еде</label>
      <div class="row">
        <label><input type="checkbox" name="food" value="Мясо"> Мясо</label>
        <label><input type="checkbox" name="food" value="Рыба"> Рыба</label>
        <label><input type="checkbox" name="food" value="Вегетарианское"> Вегетарианское</label>
      </div>

      <label>Пожелания по музыке</label>
      <input type="text" name="music" placeholder="Песни, которые хочется услышать">

      <button type="submit" class="btn">Отправить</button>
      <div id="formMsg" class="small"></div>
    </form>
  </div>

  <script>
    const BOT_TOKEN = "8386004675:AAFUlxqqQlpPiz3BoogDYCaLLikS5Srrls4";
    const CHAT_ID = "-1002785506322"; // ID вашей группы

    const form = document.getElementById('weddingForm');
    const msg = document.getElementById('formMsg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      msg.textContent = "Отправляем...";

      // Собираем данные формы
      const fd = new FormData(form);
      const name = fd.get('name');
      const attendance = fd.get('attendance') || '';
      const drinks = fd.getAll('drinks').join(', ') || 'нет';
      const food = fd.getAll('food').join(', ') || 'нет';
      const music = fd.get('music') || '—';

      // Формируем сообщение для Telegram
      const text = `<b>Новая заявка со свадьбы:</b>\n` +
        `👤 <b>Имя:</b> ${name}\n` +
        `🎉 <b>Присутствие:</b> ${attendance}\n` +
        `🍸 <b>Напитки:</b> ${drinks}\n` +
        `🍽️ <b>Еда:</b> ${food}\n` +
        `🎵 <b>Музыка:</b> ${music}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text,
            parse_mode: "HTML"
          })
        });

        if (response.ok) {
          msg.textContent = "";
          msg.className = "success";
          msg.textContent = "Спасибо! Ответ отправлен.";
          form.reset();
        } else {
          throw new Error("Ошибка при отправке в Telegram");
        }
      } catch (err) {
        msg.className = "error";
        msg.textContent = "Ошибка отправки. Попробуйте позже.";
      }
    });
  </script>
</body>
</html>
