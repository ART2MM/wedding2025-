<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Свадебное</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f8f8f8;
      color: #333;
      text-align: justify;
    }
    header {
      background: url('cover.jpg') center/cover no-repeat;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
      color: white;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
    }
    header h1 {
      font-size: 3rem;
      margin: 0;
      text-align: left;
    }
    header p {
      font-size: 1.2rem;
      text-align: left;
      margin-bottom: 2rem;
    }
    section {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h2 {
      text-align: center;
      margin-top: 2rem;
    }
    .calendar {
      display: flex;
      justify-content: center;
      margin: 1rem 0;
    }
    .calendar-day {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px;
      border-radius: 50%;
      background-color: #ddd;
    }
    .calendar-heart {
      background-color: #b2c2a9;
      position: relative;
    }
    .calendar-heart::after {
      content: "\2764";
      position: absolute;
      top: -10px;
      font-size: 16px;
      color: red;
    }
    iframe {
      width: 100%;
      height: 300px;
      border: none;
      margin-top: 1rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 2rem;
    }
    input, textarea, button {
      padding: 10px;
      font-size: 1rem;
    }
    button {
      background-color: #b2c2a9;
      border: none;
      color: white;
      cursor: pointer;
    }
    .colors-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 1rem;
    }
    .color-rectangle {
      width: 60px;
      height: 100px;
      border-radius: 4px;
    }
    #formMessage {
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Свадебное</h1>
    <p style="font-size: 2rem; font-family: cursive; margin: 0 0 1rem auto;">Артём и Аня</p>
    <p>18.10.2025, ЗАГС г. Петергоф</p>
  </header>

  <section>
    <h2>До свадьбы осталось:</h2>
    <p style="text-align: center; font-size: 2rem;">81 день</p>
  </section>

  <section>
    <h2>Программа дня</h2>
    <p>12:00 — Торжественная регистрация</p>
    <p>14:00 — Праздничный ужин в ресторане</p>
  </section>

  <section>
    <h2>Место проведения</h2>
    <p style="text-align: center;">Торговая площадь, 5, Петергоф, Санкт-Петербург</p>
    <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3Af86f309d3bfb51df42c265ba3f2a057a2e3b9982c418d1f4b51a694f0bbdc147&amp;source=constructor"></iframe>
  </section>

  <section>
    <h2>Цвета свадьбы</h2>
    <div class="colors-box">
      <div class="color-rectangle" style="background:#b2c2a9;"></div>
      <div class="color-rectangle" style="background:#e3e0cf;"></div>
      <div class="color-rectangle" style="background:#b5aaa0;"></div>
    </div>
  </section>

  <section>
    <h2>Подтвердите участие</h2>
    <form id="guestForm">
      <input name="name" placeholder="Ваше имя и фамилия *" required>

      <label><input type="radio" name="attendance" value="Приду" required> Я с удовольствием приду</label>
      <label><input type="radio" name="attendance" value="Не смогу" required> К сожалению, не смогу присутствовать</label>

      <input name="drinks" placeholder="Любимые напитки">
      <input name="food" placeholder="Предпочтения в еде">
      <textarea name="music" rows="2" placeholder="Музыкальные пожелания"></textarea>

      <button type="submit">Отправить</button>
      <p id="formMessage"></p>
    </form>
  </section>

  <script>
    const TOKEN = "8386004675:AAFUlxqqQlpPiz3BoogDYCaLLikS5Srrls4";
    const CHAT_ID = "-1002785506322";

    document.getElementById('guestForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        name: form.name.value.trim(),
        attendance: form.attendance.value,
        drinks: form.drinks.value.trim(),
        food: form.food.value.trim(),
        music: form.music.value.trim()
      };

      const text = `🎉 Новый ответ от гостя:\n\n👤 Имя: ${data.name}\n✅ Присутствие: ${data.attendance}\n🍷 Напитки: ${data.drinks || "—"}\n🍽 Еда: ${data.food || "—"}\n🎶 Музыка: ${data.music || "—"}`;

      try {
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text })
        });

        document.getElementById('formMessage').textContent = "Спасибо! Ваш ответ записан.";
        form.reset();
      } catch (err) {
        console.error(err);
        document.getElementById('formMessage').textContent = "Ошибка! Попробуйте позже.";
      }
    });
  </script>
</body>
</html>
